[app]
name = "n8n"

[catalog]
title    = "n8n"
tagline  = "Workflow automation, self-hosted."
category = "app"
license  = "Sustainable-Use-1.0"
source   = "https://github.com/n8n-io/n8n"
tags     = ["automation"]

[inputs.GENERIC_TIMEZONE]
description = "Time zone for schedules"
default     = "Europe/Istanbul"

[[databases]]
binding = "DB"

[secrets.N8N_ENCRYPTION_KEY]
generate = "hex:32"
note     = "Changing it locks every stored credential."

[services.n8n]
image    = "n8nio/n8n:1.80.0"
port     = 5678
public   = true
memoryMb = 512
uses     = ["DB"]
secrets  = ["N8N_ENCRYPTION_KEY"]
health   = "/healthz"

[services.n8n.vars]
WEBHOOK_URL      = "{app.url}"
GENERIC_TIMEZONE = "{inputs.GENERIC_TIMEZONE}"
