# The checker's own tests, for a change to the rules (checker/).
name: checker

on:
  pull_request:
    paths: ["checker/**"]
  push:
    branches: [main]
    paths: ["checker/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p .
      - run: npx vitest run
