# Every entry of the catalog must pass RFC-0021's rules before it can merge:
# the platform publishes whatever is on main at the next reindex.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: flect-catalog check
        run: npx -y -p @getflect/catalog@0.1 flect-catalog check . --fetch
